<mat-toolbar color="primary" class="mat-elevation-z4">
  <span>
    <button
        mat-mini-fab
      aria-label="Abrir ou fechar a navegação"
      (click)="sidenav?.toggle()"
    >
      <mat-icon>menu</mat-icon>
    </button>
    <span class="logo">
      <img src="assets/logo.png" alt="Logo" />
    </span>
    <span class="title">{{ title }}</span>
  </span>
  <span class="spacer"></span>

</mat-toolbar>

<mat-sidenav-container>
  <mat-sidenav
    #sidenav
    [mode]="isNarrow ? 'over' : 'side'"
    [opened]="!isNarrow"
    class="app-sidenav"
  >
    <nav aria-label="sidenav">
      <a
        mat-button
        class="nav-link"
        *ngFor="let link of links"
        [routerLink]="link.path"
        routerLinkActive="active"
      >
        <mat-icon>
          {{ link.icon }}
        </mat-icon>
        {{ link.title }}
      </a>
    </nav>

  </mat-sidenav>

  <div class="container">
    <p class="lab-notice">Angular 8 histórico · Dados fictícios e locais · Nenhuma autenticação real</p>
    <router-outlet></router-outlet>
  </div>
</mat-sidenav-container>
