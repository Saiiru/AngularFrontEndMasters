<p class="local-info" role="status">{{notice}}</p>
<p class="local-error" role="alert" *ngIf="error">{{error}}</p>
<button type="button" (click)="reset()" aria-label="Criar um novo jogo de exemplo">Novo jogo</button>
<div class="games-container">
  <div class="games-list">
    <app-games-list
      [games]="games$ | async"
      (selected)="selectGame($event)"
      (deleted)="deleteGame($event)"
    >
    </app-games-list>
  </div>
  <div class="games-details">
    <app-games-details
      [game]="selectedGame"
      (saved)="saveGame($event)"
      (reset)="reset()"
    >
    </app-games-details>
  </div>
</div>
